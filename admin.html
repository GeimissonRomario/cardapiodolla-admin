<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Cardápio Dolla</title>
    <link rel="icon" href="logo-pastel.png">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <img src="logo-pastel.png" alt="Logo">
        <span>Admin Cardápio</span>
        <button id="btn-logout">Sair</button>
    </header>

    <!-- TABS -->
    <nav id="tab-nav"></nav>

    <!-- MAIN -->
    <main>
        <!-- Produtos -->
        <div id="produtos-section">
            <div id="categoria-info"></div>
            <ul id="lista-produtos"></ul>
        </div>

        <!-- Configurações -->
        <div id="config-section" style="display:none">
            <h3 class="config-titulo">Preços por categoria</h3>
            <div id="config-form"></div>
            <button id="btn-salvar-config">💾 Salvar configurações</button>

            <h3 class="config-titulo" style="margin-top:32px">Manutenção</h3>
            <button id="btn-seed">📦 Importar cardápio padrão (1ª vez)</button>
        </div>
    </main>

    <!-- FAB Adicionar -->
    <button id="btn-add" style="display:none">+ Adicionar produto</button>

    <!-- MODAL overlay -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-titulo">Adicionar Produto</h3>

            <label class="campo-label">Nome do produto</label>
            <input id="modal-nome" type="text" placeholder="Ex: Pastel de Carne">

            <div id="campo-preco" style="display:none">
                <label class="campo-label">Preço (R$)</label>
                <input id="modal-preco" type="number" step="0.01" min="0" placeholder="Ex: 13.50">
            </div>

            <label class="ativo-label">
                <input id="modal-ativo" type="checkbox" checked>
                <span>Produto ativo (visível no cardápio)</span>
            </label>

            <div class="modal-btns">
                <button id="modal-cancelar">Cancelar</button>
                <button id="modal-salvar">Salvar</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
