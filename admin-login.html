<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Cardápio Dolla</title>
    <link rel="icon" href="logo-pastel.png">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <img src="logo-pastel.png" alt="Logo Dolla">
            <h2>Painel Admin</h2>
            <p class="login-sub">Cardápio Dolla</p>

            <input id="email"    type="email"    placeholder="E-mail" autocomplete="username">
            <input id="senha"    type="password" placeholder="Senha"  autocomplete="current-password">

            <button id="btn-entrar">Entrar</button>
            <p id="login-erro" class="login-erro"></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        auth.onAuthStateChanged(u => { if (u) location.href = 'admin.html'; });

        document.getElementById('btn-entrar').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const erro  = document.getElementById('login-erro');
            erro.textContent = '';
            if (!email || !senha) { erro.textContent = 'Preencha e-mail e senha.'; return; }
            try {
                await auth.signInWithEmailAndPassword(email, senha);
            } catch (e) {
                erro.textContent = 'E-mail ou senha incorretos.';
            }
        });

        document.getElementById('senha').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('btn-entrar').click();
        });
    </script>
</body>
</html>
